universalLipSyncPositive6:
  - mouth movement visible
  - jaw movement natural
  - natural lip-sync synchronized with dialogue
  - lips animate while speaking
  - expressive lip motion during lines
  - mandible oscillation while pronouncing vowels
universalLipSyncNegative7:
  - static mouth frozen lips
  - no mouth movement at all
  - glued-together lips
  - teeth permanently clenched never part
  - expressionless mask-like face
  - speaking lines without any lip animation
  - non-matching lip flap

sixNegativeBucketsTemplates:
  lipSync7Template:
    - static mouth
    - frozen lips
    - glued mouth
    - expressionless mask face
    - zero lip animation
    - non-matching lip flap
    - jaw never moves
  cartoonStyling13Template:
    - cartoon style
    - anime illustration
    - 2D flat art
    - stylized non-realistic
    - chibi big head
    - simplified proportions
    - thick outlines
    - cel-shaded
    - vector art
    - comic book
    - toon shader
    - rendered cel shading
    - doll/toy figurine
  materialsTexture9Template:
    - plastic-like skin
    - rubber material
    - flat solid color
    - no fabric weave
    - no metal reflection
    - no gem refraction
    - no leather pores
    - no wood grain
    - no sub-surface scattering
  proportionPerspective9Template:
    - extra large head
    - compressed height difference
    - tiny feet
    - wrong furniture scale
    - floating characters off ground
    - perspective distortion
    - vanishing point mismatch
    - doors impossibly short
    - hands too large or too small
  characterDetails10Template:
    - wrong hair color
    - missing armor pieces
    - gemstones wrong color
    - swapped eye color
    - extra fingers
    - deformed face
    - missing iconic equipment
    - outfit color wrong
    - gender switch
    - race changed (e.g. gnome suddenly human)
  basicCommon10Template:
    - low resolution
    - jpeg artifacts
    - watermark
    - text overlay
    - blurry out of focus
    - extra limbs
    - duplicate characters
    - bad anatomy
    - nonsensical background
    - logo or signature in corner
